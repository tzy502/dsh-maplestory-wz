# 冒险岛资源 + 桌宠（合并后的单一插件）
#
# 桌宠原先在 @local/dsh-desktop-pet 里单独一行，合并后不再是独立包；
# 它的配置项（mobId / mode / scale / speed / flySpeed / flyChance …）
# 直接并到这一行的 config 下。
- insert:
    - id: maplestory-wz
      name: 'dsh-maplestory-wz'
      config:
        # ── 数据源（两个 worker 共用）──
        # 必须改成你自己的冒险岛客户端 Data 目录（如 D:/MapleStory/Data）。
        # 推荐在 profile 的 cordis.patch.yml 里按同一个 id 覆盖这一项：
        # 包自带的是占位值，机器相关的路径放在你自己的 profile 里，
        # 这样插件升级不会覆盖掉你的配置。
        dataDir: /path/to/MapleStory/Data
        region: BMS
        version: 228

        # ── 桌面宠物（原 @local/dsh-desktop-pet 的行）──
        mobId: '1210102'
        originFallback: center
        scale: 1
        speed: 100
        flySpeed: 60
        flyChance: 0.35
